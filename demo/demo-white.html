<!DOCTYPE html>
<html class="onwhite" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Tablechart: White theme</title>
    <meta name="author" content="Martijn De Jongh (Martino)">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="dist/reset.css">
    <link rel="stylesheet" href="dist/reveal.css">
    <link rel="stylesheet" href="dist/theme/white.css">
    <link rel="stylesheet" href="plugin/highlight/monokai.css">
    <link rel="stylesheet" href="assets/css/demo.css">
  </head>
  <body>
    <div class="reveal onwhite"><a class="github-corner" href="https://github.com/martinomagnifico/reveal.js-tablechart" target="blank" title="View source on GitHub">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 55 55">
          <path fill="currentColor" d="M27.5 11.2a16.3 16.3 0 0 0-5.1 31.7c.8.2 1.1-.3 1.1-.7v-2.8c-4.5 1-5.5-2.2-5.5-2.2-.7-1.9-1.8-2.4-1.8-2.4-1.5-1 .1-1 .1-1 1.6.1 2.5 1.7 2.5 1.7 1.5 2.5 3.8 1.8 4.7 1.4.2-1 .6-1.8 1-2.2-3.5-.4-7.3-1.8-7.3-8 0-1.8.6-3.3 1.6-4.4-.1-.5-.7-2.1.2-4.4 0 0 1.4-.4 4.5 1.7a15.6 15.6 0 0 1 8.1 0c3.1-2 4.5-1.7 4.5-1.7.9 2.3.3 4 .2 4.4 1 1 1.6 2.6 1.6 4.3 0 6.3-3.8 7.7-7.4 8 .6.6 1.1 1.6 1.1 3v4.6c0 .4.3.9 1.1.7a16.3 16.3 0 0 0-5.2-31.7"></path>
        </svg></a>
      <div class="slides">
        <section class="title-slide">
          <h1 class="title">Tablechart</h1>
          <h3 class="subtitle">for Reveal.js: White theme</h3>
        </section>
        <section>
          <h3>Columns</h3>
          <figure class="tablechart" data-chart="column" data-chart-keys="whcol">
            <figcaption><b>Apples picked</b><br/><span>thousands</span>
            </figcaption>
            <table>
              <tbody>
                <tr>
                  <th>Spring</th>
                  <td>58</td>
                </tr>
                <tr>
                  <th>Summer</th>
                  <td>72</td>
                </tr>
                <tr>
                  <th>Autumn</th>
                  <td>70</td>
                </tr>
                <tr>
                  <th>Winter</th>
                  <td>91</td>
                </tr>
              </tbody>
            </table>
          </figure>
        </section>
        <section>
          <h3>A waterfall</h3>
          <figure class="tablechart" data-chart="waterfall" data-chart-keys="whwf">
            <figcaption><b>What happened to the crop</b><br/><span>thousands of apples</span>
            </figcaption>
            <table>
              <tbody>
                <tr data-kind="total">
                  <th>Picked</th>
                  <td>74.5</td>
                </tr>
                <tr>
                  <th>Windfalls</th>
                  <td>28.2</td>
                </tr>
                <tr>
                  <th>Bruised</th>
                  <td>-16.1</td>
                </tr>
                <tr>
                  <th>Peelings</th>
                  <td>-13.3</td>
                </tr>
                <tr>
                  <th>Late pick</th>
                  <td>4.9</td>
                </tr>
                <tr data-kind="total">
                  <th>Pressed</th>
                  <td>78.3</td>
                </tr>
              </tbody>
            </table>
          </figure>
        </section>
        <section>
          <h3>A donut</h3>
          <div class="ring">
            <figure class="tablechart" data-chart="donut" data-chart-keys="whdo">
              <figcaption><b>Where the crop went</b><br/><span>thousands of apples</span>
              </figcaption>
              <table>
                <tbody>
                  <tr data-kind="total">
                    <th>Picked</th>
                    <td>74.5</td>
                  </tr>
                  <tr>
                    <th>Juiced</th>
                    <td>38.2</td>
                  </tr>
                  <tr>
                    <th>Eaten fresh</th>
                    <td>18.1</td>
                  </tr>
                  <tr>
                    <th>Sold whole</th>
                    <td>12.4</td>
                  </tr>
                  <tr>
                    <th>Composted</th>
                    <td>5.8</td>
                  </tr>
                </tbody>
              </table>
            </figure>
          </div>
        </section>
        <section>
          <h3>With annotations</h3>
          <figure class="tablechart" data-chart="column" data-chart-keys="whtrend">
            <figcaption><b>Apples per tree</b><br/><span>each</span>
            </figcaption>
            <table>
              <tbody>
                <tr>
                  <th>2021</th>
                  <td>74</td>
                </tr>
                <tr>
                  <th>2022</th>
                  <td>80</td>
                </tr>
                <tr>
                  <th>2023</th>
                  <td>91</td>
                </tr>
                <tr>
                  <th>2024</th>
                  <td>102</td>
                </tr>
                <tr>
                  <th>2025</th>
                  <td>116</td>
                </tr>
              </tbody>
            </table>
            <div class="chart-annotations"><span data-annotation="trend" data-years="4" data-at="0.46"><span class="tablechart-caption">A year</span><span>+12%</span></span></div>
          </figure>
        </section>
      </div>
    </div>
    <script src="dist/reveal.js"></script>
    <script src="plugin/highlight/highlight.js"></script>
    <script src="plugin/tablechart/tablechart.js"></script>
    <script>
      Reveal.initialize({
      	margin: 0.1, maxScale: 1.8, width: 1080, height: 700,
      	center: true, controlsTutorial: false,
      	plugins: [ Tablechart, RevealHighlight ]
      });
    </script>
  </body>
</html>
